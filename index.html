<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aluguéis">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f4e79">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Controle Aluguéis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: uma coluna, letra grande. Resumo do mês no topo, alerta de atraso, três botões grandes de menu, lista abaixo. Selma flutua no canto. */
:root{
  --bg:#f2f4f7; --card:#ffffff; --fg:#14213a; --muted:#56637a; --line:#d9dfe8;
  --navy:#1f4e79; --navy-ink:#ffffff; --navy-soft:#e3ecf6;
  --late:#d8432c; --late-bg:#fde7e2;
  --hot:#e8730c; --hot-bg:#ffeedd;
  --warm:#c79100; --warm-bg:#fff5d1;
  --cold:#2f7fd1; --cold-bg:#e2efff;
  --paid:#1c8f55; --paid-bg:#dcf4e6;
  --gray:#6b7891; --gray-bg:#eceff4;
  --selma:#7a3fb0; --selma-bg:#f1e8fa;
  --shadow:0 1px 2px rgba(20,33,58,.06),0 4px 14px rgba(20,33,58,.07);
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1622; --card:#18212f; --fg:#eaeef5; --muted:#a3afc2; --line:#2b3648;
  --navy:#3b78b5; --navy-soft:#1b2b44;
  --late:#ff7a63; --late-bg:#3a1f1b; --hot:#ff9d4a; --hot-bg:#3a2714;
  --warm:#f2c23d; --warm-bg:#352c12; --cold:#6aaeff; --cold-bg:#16294a;
  --paid:#4ccf88; --paid-bg:#123324; --gray:#a3afc2; --gray-bg:#222c3b;
  --selma:#c08cf0; --selma-bg:#2d2140; --shadow:none; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.4;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:14px 120px;display:flex;flex-direction:column;gap:16px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--cold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg{flex:none}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{font-family:var(--display);font-weight:800;font-size:1.75rem;margin:0;letter-spacing:-.02em}
.month{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.month button{border:0;background:transparent;width:42px;height:42px;border-radius:50%;font-size:1.4rem;font-weight:800;line-height:1}
.month button:active{background:var(--line)}
.month span{font-weight:800;min-width:92px;text-align:center}

/* resumo */
.sum{background:var(--navy);color:var(--navy-ink);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
.sum .lbl{font-size:.82rem;text-transform:uppercase;letter-spacing:.07em;opacity:.9;font-weight:800}
.sum .big{font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1.05;margin-top:2px}
.sum .of{opacity:.9;font-weight:700;margin-top:4px;font-size:1rem}
.bar{display:flex;height:12px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.bar i{display:block;height:100%;transition:width .4s}
.b-paid{background:#7ef0b0}.b-open{background:#8cc2ff}.b-late{background:#ff8a73}
.tiles{display:flex;flex-direction:column;gap:10px}
.tile{border:0;border-radius:18px;padding:16px 16px;text-align:left;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;min-width:0;outline:4px solid transparent;outline-offset:-4px;min-height:84px}
.tile .tic{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.tile.paid .tic{background:var(--paid)}.tile.open .tic{background:var(--cold)}.tile.late .tic{background:var(--late)}
.tile small{display:block;font-size:1.2rem;font-weight:800;font-family:var(--display);line-height:1.1}
.tile span{display:block;font-size:.95rem;font-weight:700;opacity:.9;margin-top:2px}
.tile strong{font-family:var(--display);font-weight:800;font-size:1.45rem;line-height:1.1;text-align:right;white-space:nowrap}
.tile .arr{font-size:1.3rem;opacity:.6;margin-left:-6px}
.tile.paid{background:var(--paid-bg);color:var(--paid)}
.tile.open{background:var(--cold-bg);color:var(--cold)}
.tile.late{background:var(--late-bg);color:var(--late)}
.tile[aria-pressed="true"]{outline-color:var(--navy-ink)}
@media (max-width:370px){.tile strong{font-size:1.2rem}.tile{gap:10px;padding:14px 12px}.tile .tic{width:38px;height:38px}}

/* alerta */
.alert{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--late);background:var(--late-bg);color:var(--fg);border-radius:18px;padding:14px}
.alert .ic{width:44px;height:44px;border-radius:50%;background:var(--late);color:#fff;display:flex;align-items:center;justify-content:center}
.alert b{display:block;color:var(--late);font-size:1.05rem}
.alert span{display:block;font-weight:700;font-size:.92rem;color:var(--muted)}
.alert .go{margin-left:auto;font-weight:800;color:var(--late);white-space:nowrap}

/* menu principal */
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu button{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:12px 10px;display:flex;flex-direction:row;align-items:center;gap:10px;font-weight:800;font-size:1rem;line-height:1.15;text-align:left;min-height:68px}
.menu button svg{color:var(--navy)}
.menu button[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:var(--navy-ink)}
.menu button[aria-pressed="true"] svg{color:var(--navy-ink)}

/* barra de ordenação */
.bar2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar2 label{font-weight:800;color:var(--muted);font-size:.95rem}
.bar2 select{flex:1;min-width:180px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:11px 12px;font-weight:700}
.search{width:100%;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:600}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.seg button small{font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.seg button strong{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1}
.seg button span{font-weight:700;font-size:.85rem;color:var(--muted)}
.seg .ok strong{color:var(--paid)}.seg .ok[aria-pressed="true"]{border-color:var(--paid);background:var(--paid-bg)}
.seg .bad strong{color:var(--late)}.seg .bad[aria-pressed="true"]{border-color:var(--late);background:var(--late-bg)}
.seg .neu strong{color:var(--navy)}.seg .neu[aria-pressed="true"]{border-color:var(--navy);background:var(--navy-soft)}
.seg .vac strong{color:var(--warm)}.seg .vac[aria-pressed="true"]{border-color:var(--warm);background:var(--warm-bg)}

/* grupos e cartões */
.list{display:flex;flex-direction:column;gap:22px}
.group{display:flex;flex-direction:column;gap:10px}
.inqitem{display:flex;flex-direction:column;gap:6px}
.inqitem textarea.nota{width:100%;min-height:52px;resize:none;overflow:hidden;background:var(--card);color:var(--fg);border:2px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;font-weight:600;font-size:1rem;line-height:1.35}
.inqitem textarea.nota:focus{outline:none;border-color:var(--cold)}
.inqitem textarea.nota::placeholder{color:var(--muted);font-weight:600}
.inqitem .notast{font-size:.8rem;font-weight:700;color:var(--muted);text-align:right;min-height:1em;margin-top:-2px}
.ghead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-inline:2px}
.ghead h2{margin:0;font-family:var(--display);font-weight:800;font-size:1.2rem;display:flex;align-items:center;gap:8px}
.ghead h2 .dot{width:14px;height:14px;border-radius:50%}
.ghead .tot{color:var(--muted);font-weight:700;font-size:.92rem;white-space:nowrap}
.card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--shadow);border:1px solid var(--line);border-left:7px solid var(--line)}
.card:active{transform:scale(.99)}
.who{min-width:0}
.who strong{display:block;font-size:1.08rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who em{display:block;font-style:normal;color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.amt strong{font-weight:800}
.tag{font-size:.78rem;font-weight:800;padding:4px 9px;border-radius:99px;white-space:nowrap}
.day{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;width:58px;height:58px;font-weight:800;line-height:1}
.day small{font-size:.62rem;letter-spacing:.08em;margin-bottom:3px}
.day span{font-family:var(--display);font-size:1.55rem}
.day.unit span{font-size:1rem;text-align:center;padding-inline:2px}
/* temperaturas */
.t-late{border-left-color:var(--late)} .t-late .day,.t-late .tag{background:var(--late-bg);color:var(--late)}
.t-hot{border-left-color:var(--hot)} .t-hot .day,.t-hot .tag{background:var(--hot-bg);color:var(--hot)}
.t-warm{border-left-color:var(--warm)} .t-warm .day,.t-warm .tag{background:var(--warm-bg);color:var(--warm)}
.t-cold{border-left-color:var(--cold)} .t-cold .day,.t-cold .tag{background:var(--cold-bg);color:var(--cold)}
.t-paid{border-left-color:var(--paid)} .t-paid .day,.t-paid .tag{background:var(--paid-bg);color:var(--paid)}
.t-na,.t-vac{border-left-color:var(--gray)} .t-na .day,.t-na .tag{background:var(--gray-bg);color:var(--gray)}
.t-vac .day,.t-vac .tag{background:var(--warm-bg);color:var(--warm)}
.thermo{display:flex;gap:3px;margin-top:6px}
.thermo i{width:16px;height:6px;border-radius:3px;background:var(--line)}
.t-cold .thermo i.on{background:var(--cold)}.t-warm .thermo i.on{background:var(--warm)}.t-hot .thermo i.on{background:var(--hot)}.t-late .thermo i.on{background:var(--late)}.t-paid .thermo i.on{background:var(--paid)}
.debt{display:block;color:var(--late);font-weight:800;font-size:.88rem;margin-top:2px}

/* endereços */
.addr{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.addr h3{margin:0;font-family:var(--display);font-weight:800;font-size:1.3rem;display:flex;justify-content:space-between;gap:8px;align-items:center}
.addr h3 span{color:var(--muted);font-family:var(--body);font-size:1.4rem}
.addr .facts{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.85rem;font-weight:800;padding:5px 10px;border-radius:99px;background:var(--gray-bg);color:var(--muted)}
.chip.ok{background:var(--paid-bg);color:var(--paid)}.chip.bad{background:var(--late-bg);color:var(--late)}.chip.vac{background:var(--warm-bg);color:var(--warm)}
.mini{height:8px;border-radius:99px;background:var(--gray-bg);overflow:hidden;display:flex}
.mini i{height:100%}
.back{align-self:flex-start;border:0;background:var(--navy-soft);color:var(--navy);font-weight:800;padding:10px 16px;border-radius:99px}
.pagetitle{margin:0;font-family:var(--display);font-weight:800;font-size:1.5rem}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.row2 .btn{flex:1;min-width:150px}

/* índice */
.idx{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.idx p{margin:0;color:var(--muted);font-weight:600;font-size:.95rem}
.idxrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.idxrow:first-of-type{border-top:0}
.idxrow b{font-weight:800}
.idxrow em{font-style:normal;color:var(--muted);font-size:.88rem;grid-column:1/-1}
.grade{font-weight:800;font-size:.8rem;padding:4px 10px;border-radius:99px}
.g-alta{background:var(--paid-bg);color:var(--paid)}.g-media{background:var(--warm-bg);color:var(--warm)}.g-baixa{background:var(--late-bg);color:var(--late)}
.meter{grid-column:1/-1;height:8px;border-radius:99px;background:var(--gray-bg);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px}

/* saldo e parcial */
.saldo{display:inline-block;margin-top:4px;background:var(--late);color:#fff;font-weight:800;font-size:.85rem;padding:3px 9px;border-radius:8px}
.m-part{background:var(--hot-bg);color:var(--hot)}
.ln .bt{display:flex;gap:6px}
.ln .bt button.part{background:var(--hot)}
.partbox{border:2px solid var(--hot);background:var(--hot-bg);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
/* planilha */
.ptools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ptools .yr{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px}
.ptools .yr button{border:0;background:transparent;width:40px;height:40px;border-radius:50%;font-size:1.3rem;font-weight:800}
.ptools .yr span{font-weight:800;min-width:56px;text-align:center}
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;-webkit-overflow-scrolling:touch}
table.pl{border-collapse:separate;border-spacing:0;font-size:.9rem;min-width:100%}
table.pl th,table.pl td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
table.pl thead th{background:var(--navy);color:var(--navy-ink);font-weight:800;position:sticky;top:0;z-index:2}
table.pl .st{position:sticky;left:0;background:var(--card);text-align:left;z-index:1;border-right:1px solid var(--line);max-width:150px;overflow:hidden;text-overflow:ellipsis}
table.pl thead .st{background:var(--navy);z-index:3}
table.pl .st b{display:block;font-size:.92rem}
table.pl .st small{display:block;color:var(--muted);font-weight:700;font-size:.78rem}
table.pl tr.grp td{background:var(--navy-soft);color:var(--navy);font-weight:800;text-align:left}
table.pl tr.grp td.st{background:var(--navy-soft)}
table.pl tfoot td{font-weight:800;background:var(--bg)}
table.pl tfoot td.st{background:var(--bg)}
.c-ok{color:var(--paid);font-weight:800}.c-part{color:var(--hot);font-weight:800}.c-late{color:var(--late);font-weight:800}
.c-open{color:var(--cold);font-weight:700}.c-na{color:var(--gray);font-size:.78rem;font-weight:700}
td.cl{cursor:pointer}
.c-saldo{color:var(--late);font-weight:800}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--muted);font-weight:700}
.foot{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:10px}
.link{border:0;background:transparent;color:var(--muted);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:8px}

/* folha (bottom sheet) */
.scrim{position:fixed;inset:0;background:rgba(10,18,30,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:24px 24px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow-y:auto}
.sheet h3{margin:0;font-family:var(--display);font-weight:800;font-size:1.55rem}
.sheet .sub{color:var(--muted);font-weight:700;margin-top:-8px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--bg);border-radius:12px;padding:10px}
.kv small{display:block;color:var(--muted);font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.kv b{font-size:1.05rem}
.btn{border:0;border-radius:16px;padding:16px;font-weight:800;font-size:1.08rem;width:100%;text-align:center}
.btn.pay{background:var(--paid);color:#fff}
.btn.main{background:var(--navy);color:var(--navy-ink)}
.btn.ghost{background:var(--bg);color:var(--fg)}
.btn.danger{background:var(--late-bg);color:var(--late)}
.btn:disabled{opacity:.6}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opts button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 4px;font-weight:800}
.opts button[aria-pressed="true"]{border-color:var(--paid);background:var(--paid-bg);color:var(--paid)}
.box{border:2px solid var(--late);background:var(--late-bg);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.box h4{margin:0;color:var(--late);font-size:1.05rem}
.box .ln{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:12px;padding:8px 10px;font-weight:700}
.box .ln button{border:0;background:var(--paid);color:#fff;font-weight:800;border-radius:10px;padding:9px 12px}
.hist h4{margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.hist h4 span{display:flex;gap:4px}
.hist h4 button{border:1px solid var(--line);background:var(--card);border-radius:10px;width:38px;height:34px;font-weight:800}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.months button{border:0;border-radius:10px;padding:8px 2px;font-weight:800;font-size:.8rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.months button i{font-style:normal;font-size:.68rem;font-weight:700}
.m-paid{background:var(--paid-bg);color:var(--paid)}.m-late{background:var(--late-bg);color:var(--late)}
.m-open{background:var(--cold-bg);color:var(--cold)}.m-na{background:var(--gray-bg);color:var(--gray)}.m-none{background:var(--bg);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.8rem;font-weight:700;color:var(--muted);margin-top:8px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
form{display:flex;flex-direction:column;gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:800;font-size:.9rem;color:var(--muted)}
label.f input,label.f select{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px;font-size:1.05rem;width:100%;color:var(--fg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{color:var(--muted);font-size:.92rem;font-weight:600;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:99px;font-weight:800;z-index:40;max-width:90vw;text-align:center}

/* Selma */
.selmaBtn{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:15;border:0;background:var(--selma);color:#fff;font-weight:800;font-size:1.05rem;padding:14px 20px 14px 14px;border-radius:99px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(122,63,176,.4)}
.selmaBtn .av{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--selma);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800}
.chat{position:fixed;inset:auto 0 0 0;z-index:30;display:flex;justify-content:center;pointer-events:none}
.chatbox{pointer-events:auto;width:100%;max-width:640px;height:min(78vh,640px);background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(10,18,30,.25);display:flex;flex-direction:column;border:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.chathead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.chathead .av{width:40px;height:40px;border-radius:50%;background:var(--selma);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:1.2rem}
.chathead b{font-family:var(--display);font-size:1.25rem}
.chathead small{display:block;color:var(--muted);font-weight:700;font-size:.82rem}
.chathead button{margin-left:auto;border:0;background:var(--bg);border-radius:99px;padding:10px 14px;font-weight:800}
.msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:11px 14px;border-radius:18px;font-weight:600;white-space:pre-wrap;word-wrap:break-word}
.msg.s{background:var(--selma-bg);align-self:flex-start;border-bottom-left-radius:6px}
.msg.u{background:var(--navy);color:var(--navy-ink);align-self:flex-end;border-bottom-right-radius:6px}
.msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:.85rem;padding:2px}
.quick{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.quick button{flex:none;border:2px solid var(--selma);background:var(--card);color:var(--selma);font-weight:800;border-radius:99px;padding:8px 14px;font-size:.9rem}
.compose{display:flex;flex-direction:row;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line)}
.compose input{flex:1;min-width:0;background:var(--bg);border:2px solid var(--line);border-radius:99px;padding:12px 16px}
.compose button{border:0;background:var(--selma);color:#fff;font-weight:800;border-radius:99px;padding:0 18px}

/* login */
.login{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login form{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;width:100%;max-width:400px;box-shadow:var(--shadow)}
.login h1{margin:0;font-family:var(--display);font-weight:800;font-size:2rem}
.login p{margin:0;color:var(--muted);font-weight:600}
.err{color:var(--late);font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<div class="wrap">
  <header class="top">
    <h1>Aluguéis</h1>
    <div class="month">
      <button id="prevM" aria-label="Mês anterior">‹</button>
      <span id="mLabel" class="num">—</span>
      <button id="nextM" aria-label="Próximo mês">›</button>
    </div>
  </header>

  <section class="sum" aria-live="polite">
    <div>
      <div class="lbl" id="sLbl">Total a receber no mês</div>
      <div class="big num" id="sTot">R$ 0,00</div>
      <div class="of num" id="sOf">Já pago: R$ 0,00</div>
    </div>
    <div class="bar"><i class="b-paid" id="bPaid"></i><i class="b-open" id="bOpen"></i><i class="b-late" id="bLate"></i></div>
    <div class="tiles">
      <button class="tile paid" data-st="paid" aria-pressed="false"><span class="tic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span><small>Pago</small><span class="num" id="nPaid">0 inquilinos</span></span><strong class="num" id="vPaid">R$ 0</strong></button>
      <button class="tile open" data-st="open" aria-pressed="false"><span class="tic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span><span><small>A pagar</small><span class="num" id="nOpen">0 inquilinos</span></span><strong class="num" id="vOpen">R$ 0</strong></button>
      <button class="tile late" data-st="late" aria-pressed="false"><span class="tic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 6.5v7M12 17.5h.01"/></svg></span><span><small>Atrasado</small><span class="num" id="nLate">0 inquilinos</span></span><strong class="num" id="vLate">R$ 0</strong></button>
    </div>
  </section>

  <button class="alert" id="alert" hidden>
    <span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 8v5M12 17h.01"/><path d="M10.3 3.9 2.4 17.6A2 2 0 0 0 4.1 20.6h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></span>
    <span><b id="alT">—</b><span id="alS">—</span></span>
    <span class="go">Ver ›</span>
  </button>

  <nav class="menu" aria-label="Menu">
    <button data-view="prazo" aria-pressed="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M14 14.76V4a2 2 0 0 0-4 0v10.76a4 4 0 1 0 4 0z"/><path d="M12 9v7"/></svg>
      Inquilinos /<br>Prazo</button>
    <button data-view="inq" aria-pressed="false">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.9.7 3.1 2.5 3.5 5.2"/></svg>
      Inquilinos</button>
    <button data-view="end" aria-pressed="false">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V8l7-5 7 5v13"/><path d="M9 21v-6h6v6M9 11h.01M15 11h.01"/></svg>
      Endereços</button>
    <button data-view="plan" aria-pressed="false">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9.5h18M3 15h18M9 4v16"/></svg>
      PLANILHA</button>
  </nav>

  <div class="bar2" id="sortBar">
    <label for="sortSel">Ordenar por</label>
    <select id="sortSel">
      <option value="dia">Data de pagamento</option>
      <option value="nome">Nome do inquilino</option>
      <option value="end">Endereço</option>
      <option value="valor">Valor do aluguel</option>
      <option value="atraso">Mais atrasado primeiro</option>
    </select>
  </div>

  <main id="list" class="list"><div class="empty">Carregando…</div></main>

  <div class="foot">
    <button class="link" id="idxLink">Índice Imóveis</button>

  </div>
</div>

    <h1>Aluguéis</h1>

</div>

<script>

  authDomain: "alugueis-do-xande.firebaseapp.com",

  storageBucket: "alugueis-do-xande.firebasestorage.app",

<script>
(function(){
/* ---------- utilidades ---------- */
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const MES3=MESES.map(m=>m.slice(0,3));
const SEM=["dom","seg","ter","qua","qui","sex","sáb"];
const LATE_START="2026-01"; /* parcelas em atraso contam a partir daqui */
const brl=v=>"R$ "+Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:0,maximumFractionDigits:2});
const brlS=v=>{v=Number(v||0);return v>=10000?"R$ "+(v/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil":brl(v)};
const brl2=v=>"R$ "+Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymOf=(y,m)=>y+"-"+pad(m+1);
const ymParts=s=>{const [y,m]=s.split("-").map(Number);return {y,m:m-1}};
const ymAdd=(s,n)=>{const p=ymParts(s);const d=new Date(p.y,p.m+n,1);return ymOf(d.getFullYear(),d.getMonth())};
const ymLabel=s=>{const p=ymParts(s);return MES3[p.m]+"/"+String(p.y).slice(2)};
const daysIn=(y,m)=>new Date(y,m+1,0).getDate();
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

let now=new Date();
const CUR=()=>ymOf(now.getFullYear(),now.getMonth());
const state={y:now.getFullYear(),m:now.getMonth(),view:lsGet("al_view","prazo"),sort:lsGet("al_sort","dia"),st:null,
  inqTab:"late",q:"",endSel:null,endTab:"todas",tenants:[],pays:{},ready:false,db:null,cfg:{}};
const ym=()=>ymOf(state.y,state.m);

/* ---------- regras de negócio ---------- */
function dueDayIn(t,y,m){return Math.min(Number(t.dia)||1,daysIn(y,m))}
function dueDay(t){return dueDayIn(t,state.y,state.m)}
function entry(t,ymS){const e=(state.pays[ymS]||{})[t.id];return e||null}
const isPaid=e=>!!(e&&e.forma);
const isNA=e=>!!(e&&e.obs);
function startOf(t){return t.desde&&t.desde>LATE_START?t.desde:LATE_START}

/* quanto foi pago e quanto falta numa parcela */
const remainder=e=>(e&&e.forma&&e.devido!=null)?Math.max(0,Number(e.devido)-Number(e.valor||0)):0;
const paidAmt=(e,t)=>isPaid(e)?(e.devido!=null||e.valor!=null?Number(e.valor||0):Number(t.valor||0)):0;
/* débitos do inquilino até hoje: meses não pagos (vencidos) e restos de pagamentos parciais */
function debtList(t){
  if(t.ativo===false) return [];
  const out=[], cur=CUR(), today=now.getDate();
  for(let s=startOf(t); s<=cur; s=ymAdd(s,1)){
    const e=entry(t,s);
    if(isNA(e)) continue;
    if(isPaid(e)){const r=remainder(e); if(r>0.009) out.push({ym:s,falta:r,parcial:true,pago:Number(e.valor||0)}); continue;}
    const p=ymParts(s);
    if(s<cur||dueDayIn(t,p.y,p.m)<today) out.push({ym:s,falta:Number(t.valor||0),parcial:false});
  }
  return out;
}
const lateList=t=>debtList(t).map(d=>d.ym);
const saldo=t=>debtList(t).reduce((a,d)=>a+d.falta,0);
/* situação no mês escolhido */
function status(t){
  const e=entry(t,ym());
  if(isPaid(e)&&!(remainder(e)>0.009)) return {k:"paid",temp:"paid",label:"Pago · "+e.forma,e};
  if(isNA(e)) return {k:"na",temp:"na",label:e.obs,e};
  const base=statusUnpaid(t,e);
  if(isPaid(e)){const r=remainder(e);base.part=true;base.pago=Number(e.valor||0);base.falta=r;base.label="Pagou "+brl(e.valor)+" · falta "+brl(r);base.e=e}
  return base;
}
function statusUnpaid(t,e){
  const sel=ym(), cur=CUR(), d=dueDay(t);
  if(sel<cur){
    if(sel<startOf(t)) return e&&e.nao?{k:"late",temp:"late",label:"Não pago"}:{k:"na",temp:"na",label:"Sem registro"};
    return {k:"late",temp:"late",label:"Atrasado"};
  }
  if(sel>cur) return {k:"open",temp:"cold",label:"Vence dia "+pad(d)};
  const today=now.getDate();
  if(d<today){const n=today-d;return {k:"late",temp:"late",label:n+(n===1?" dia":" dias")+" de atraso"}}
  if(d===today) return {k:"open",temp:"hot",label:"Vence hoje"};
  const n=d-today;
  if(n<=7) return {k:"open",temp:"warm",label:n===1?"Vence amanhã":"Vence em "+n+" dias"};
  return {k:"open",temp:"cold",label:"Vence em "+n+" dias"};
}
const TEMP_LEVEL={cold:1,warm:2,hot:4,late:5,paid:5,na:0};
const active=()=>state.tenants.filter(t=>t.ativo!==false);
const predios=()=>[...new Set(state.tenants.map(t=>t.predio).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt-BR",{numeric:true}));
const unitCmp=(a,b)=>String(a.unidade).localeCompare(String(b.unidade),"pt-BR",{numeric:true});
function sorter(){
  const s=state.sort;
  if(s==="nome") return (a,b)=>String(a.nome).localeCompare(String(b.nome),"pt-BR");
  if(s==="end") return (a,b)=>String(a.predio).localeCompare(String(b.predio),"pt-BR",{numeric:true})||unitCmp(a,b);
  if(s==="valor") return (a,b)=>Number(b.valor||0)-Number(a.valor||0);
  if(s==="atraso") return (a,b)=>saldo(b)-saldo(a)||dueDay(a)-dueDay(b);
  return (a,b)=>dueDay(a)-dueDay(b)||String(a.nome).localeCompare(String(b.nome),"pt-BR");
}

/* ---------- desenho ---------- */
const $=id=>document.getElementById(id);
function thermo(temp){const lv=TEMP_LEVEL[temp]||0;return `<span class="thermo" aria-hidden="true">${[1,2,3,4,5].map(i=>`<i class="${i<=lv?"on":""}"></i>`).join("")}</span>`}
function tenantCard(t,opts={}){
  const s=status(t), d=dueDay(t), dl=debtList(t), sd=dl.reduce((a,x)=>a+x.falta,0);
  const debt=sd>0.009?`<span class="saldo">Saldo devedor ${brl(sd)}</span>${opts.showDebt?`<span class="debt">${dl.length} parcela${dl.length>1?"s":""} em aberto</span>`:""}`:"";
  return `<button class="card t-${s.temp}" data-id="${esc(t.id)}">
    <div class="day"><small>DIA</small><span class="num">${pad(d)}</span></div>
    <div class="who"><strong>${esc(t.nome||"Sem nome")}</strong><em>${esc(t.unidade||"")} · ${esc(t.predio||"")}</em>${opts.thermo?thermo(s.temp):""}${debt}</div>
    <div class="amt"><strong class="num">${brl(t.valor)}</strong><span class="tag">${esc(s.label)}</span></div>
  </button>`;
}
function unitShort(u){return String(u||"—").replace(/^AP\s*/i,"").replace(/^(LJ|Loja)\s*/i,"").replace(/^Sala\s*/i,"")}
function unitKind(u){u=u||"";return /^(LJ|Loja)/i.test(u)?"LOJA":/^AP/i.test(u)?"AP":/^Sala/i.test(u)?"SALA":"UNID"}
function unitCard(t){
  if(t.ativo===false) return `<button class="card t-vac" data-id="${esc(t.id)}">
    <div class="day unit"><small>${unitKind(t.unidade)}</small><span class="num">${esc(unitShort(t.unidade))}</span></div>
    <div class="who"><strong>Vaga</strong><em>${esc(t.unidade||"")} · último: ${esc(t.nome||"—")}</em></div>
    <div class="amt"><strong class="num">${brl(t.valor)}</strong><span class="tag">Desocupada</span></div></button>`;
  const s=status(t);
  return `<button class="card t-${s.temp}" data-id="${esc(t.id)}">
    <div class="day unit"><small>${unitKind(t.unidade)}</small><span class="num">${esc(unitShort(t.unidade))}</span></div>
    <div class="who"><strong>${esc(t.nome||"Sem nome")}</strong><em>Vence dia ${pad(dueDay(t))}</em></div>
    <div class="amt"><strong class="num">${brl(t.valor)}</strong><span class="tag">${esc(s.label)}</span></div></button>`;
}
function group(title,color,items,render,extra=""){
  if(!items.length) return "";
  const tot=items.reduce((a,t)=>a+Number(t.valor||0),0);
  return `<section class="group"><div class="ghead"><h2>${color?`<span class="dot" style="background:var(--${color})"></span>`:""}${esc(title)}</h2><span class="tot num">${items.length} · ${brl(tot)}</span></div>${extra}${items.map(render).join("")}</section>`;
}

function renderHeader(){
  $("mLabel").textContent=MES3[state.m]+" "+state.y;
  const all=active();
  const sum={paid:[0,0],open:[0,0],late:[0,0]};
  let paidV=0;
  all.forEach(t=>{const s=status(t);if(s.k==="na")return;
    if(s.k==="paid"){paidV+=paidAmt(s.e,t);sum.paid[1]++;return}
    if(s.part){paidV+=s.pago;sum[s.k][0]+=s.falta;sum[s.k][1]++;return}
    sum[s.k][0]+=Number(t.valor||0);sum[s.k][1]++});
  sum.paid[0]=paidV;
  const total=sum.paid[0]+sum.open[0]+sum.late[0];
  $("sLbl").textContent="Total a receber em "+MESES[state.m];
  $("sTot").textContent=brl2(total);
  $("sOf").textContent="Já pago: "+brl2(sum.paid[0])+" · falta "+brl2(total-sum.paid[0]);
  const pct=v=>(total?v/total*100:0)+"%";
  $("bPaid").style.width=pct(sum.paid[0]);$("bOpen").style.width=pct(sum.open[0]);$("bLate").style.width=pct(sum.late[0]);
  const qt=n=>n+(n===1?" inquilino":" inquilinos");
  [["paid","Paid"],["open","Open"],["late","Late"]].forEach(([k,K])=>{$("v"+K).textContent=brlS(sum[k][0]);$("n"+K).textContent=qt(sum[k][1])});
  document.querySelectorAll(".tile").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.st===state.st)));
  /* alerta geral de atrasos (sempre até hoje) */
  const lateT=active().map(t=>({t,l:debtList(t)})).filter(x=>x.l.length);
  const parc=lateT.reduce((a,x)=>a+x.l.length,0), val=lateT.reduce((a,x)=>a+x.l.reduce((b,d)=>b+d.falta,0),0);
  $("alert").hidden=!state.ready||!lateT.length;
  $("alT").textContent=lateT.length+(lateT.length===1?" inquilino atrasado":" inquilinos atrasados");
  $("alS").textContent=parc+(parc===1?" parcela":" parcelas")+" em aberto · saldo devedor "+brl(val);
  document.querySelectorAll(".menu [data-view]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.view===state.view)));
  $("sortBar").hidden=state.view==="idx"||state.view==="plan"||(state.view==="end"&&!state.endSel);
  $("sortSel").value=state.sort;
}

function fitNota(ta){ta.style.height="auto";ta.style.height=(ta.scrollHeight+4)+"px"}
const notaTimers={};
async function saveNota(id,val){clearTimeout(notaTimers[id]);delete notaTimers[id];
  const t=findT(id);if(!t||!state.db)return;
  const v=String(val||"").trim();if(v===String(t.nota||"").trim())return;
  const st=()=>[...document.querySelectorAll("[data-notast]")].find(x=>x.dataset.notast===id);
  try{await state.db.collection("inquilinos").doc(id).update({nota:v});const e=st();if(e)e.textContent="Salvo ✓"}
  catch(x){const e=st();if(e)e.textContent="Não salvou — confira a internet";}
}
function render(){
  renderHeader();
  const L=$("list");
  if(!state.ready){L.innerHTML=`<div class="empty">Carregando…</div>`;return}
  if(!state.tenants.length){L.innerHTML=`<div class="empty">Nenhum aluguel cadastrado ainda.<br>Toque em <b>Dados e conta</b>, lá embaixo, para importar o backup.</div>`;return}
  const fa=document.activeElement;let keep=null;
  if(fa&&fa.matches&&fa.matches("textarea.nota")) keep={id:fa.dataset.nota,v:fa.value,a:fa.selectionStart,b:fa.selectionEnd};
  if(state.view==="inq"){L.innerHTML=viewInq();
    L.querySelectorAll("textarea.nota").forEach(fitNota);
    if(keep){const ta=[...L.querySelectorAll("textarea.nota")].find(x=>x.dataset.nota===keep.id);
      if(ta){ta.value=keep.v;fitNota(ta);ta.focus({preventScroll:true});try{ta.setSelectionRange(keep.a,keep.b)}catch(x){}}}}
  else if(state.view==="end") L.innerHTML=viewEnd();
  else if(state.view==="idx") L.innerHTML=viewIdx();
  else if(state.view==="plan") L.innerHTML=viewPlan();
  else L.innerHTML=viewPrazo();
}

function viewPrazo(){
  let items=active(); const srt=sorter();
  if(state.st) items=items.filter(t=>status(t).k===state.st);

function cellInfo(t,s){
  const e=entry(t,s), cur=CUR(), p=ymParts(s);
  if(isPaid(e)){const r=remainder(e);const prev=Number(e.devido||e.valor||t.valor||0);
    return r>0.009?{c:"c-part",txt:brl(e.valor),tip:"pagou parte",prev,rec:Number(e.valor||0)}:{c:"c-ok",txt:"✓",tip:"pago",prev,rec:paidAmt(e,t)}}
  if(isNA(e)) return {c:"c-na",txt:/desoc|vago|saiu/i.test(e.obs)?"vago":/sem registro/i.test(e.obs)?"":"s/ cob.",prev:0,rec:0};
  if(s>cur) return {c:"",txt:"",prev:t.ativo===false?0:Number(t.valor||0),rec:0,fut:true};
  if(t.ativo===false&&s>=CUR()) return {c:"c-na",txt:"vago",prev:0,rec:0};
  if(s<startOf(t)&&!(e&&e.nao)) return {c:"c-na",txt:"",prev:0,rec:0};
  const late=s<cur||dueDayIn(t,p.y,p.m)<now.getDate();
  return late?{c:"c-late",txt:"✗",tip:"não pago",prev:Number(t.valor||0),rec:0}:{c:"c-open",txt:"a pagar",prev:Number(t.valor||0),rec:0};
}

/* ---------- índice de imóveis ---------- */
function computeIndex(){
  const months=Object.keys(state.pays).filter(s=>s<CUR()).sort();
  const res=state.tenants.map(t=>{
    let obs=0,occ=0,vac=0,vacMk=0,vacInf=0,unpaid=0,first=null,last=null;
    const periods=[]; let curP=null;
    months.forEach(s=>{
      const e=entry(t,s);
      const isVac=e&&e.obs&&/desoc|vago|saiu/i.test(e.obs);
      const noInfo=e&&e.obs&&!isVac;
      if(noInfo) return;
      if(first===null){ if(!e) return; first=s; }
      obs++; last=s;
      if(isVac){vac++; if(/sem registro/i.test(e.obs)) vacInf++; else vacMk++;
        if(!curP){curP={de:s,ate:s,n:0};periods.push(curP)} curP.ate=s; curP.n++;}
      else {occ++; curP=null; if(!isPaid(e)) unpaid++;}
    });
    const vagaHoje=t.ativo===false;
    const occP=obs?occ/obs:0, payP=occ?(occ-unpaid)/occ:0;
    const score=Math.round(occP*100);
    const grade=score>=95?"alta":score>=85?"media":"baixa";
    return {t,obs,occ,vac,vacMk,vacInf,unpaid,ep:periods.length,periods,first,last,vagaHoje,occP,payP,score,grade};
  }).filter(r=>r.obs>0);
  return {months,res};
}
function viewIdx(){
  const {months,res}=computeIndex();
  if(!res.length) return `<button class="back" data-act="idxback">‹ Voltar</button><div class="empty">Ainda não há meses suficientes para calcular o índice.</div>`;
  const first=months.find(s=>res.some(r=>entry(r.t,s)))||months[0], last=months[months.length-1];
  const missing=[];for(let m=first;m<=last;m=ymAdd(m,1)){if(!state.pays[m])missing.push(m)}
  const gName={alta:"Liquidez alta",media:"Liquidez média",baixa:"Liquidez baixa"};
  const gColor={alta:"var(--paid)",media:"var(--warm)",baixa:"var(--late)"};
  const per=p=>p.de===p.ate?ymLabel(p.de):ymLabel(p.de)+" a "+ymLabel(p.ate);
  const row=r=>`<div class="idxrow"><b>${esc(r.t.unidade||"—")} · ${esc(r.t.predio)}</b><span class="grade g-${r.grade}">${r.score}% alugado</span>
    <div class="meter"><i style="width:${r.score}%;background:${gColor[r.grade]}"></i></div>
    <em><b style="color:var(--fg)">${r.obs} meses com dados</b> (${ymLabel(r.first)} a ${ymLabel(r.last)}): alugado ${r.occ} · <b style="color:${r.vac?"var(--late)":"var(--fg)"}">vago ${r.vac}</b>${r.vagaHoje?" · está vago hoje":""}</em>
    ${r.vac?`<em>Ficou vago em ${r.ep} ${r.ep>1?"períodos diferentes":"período"}: ${r.periods.map(p=>`${per(p)} (${p.n} ${p.n>1?"meses":"mês"})`).join("; ")}.${r.vacInf?` Desses, ${r.vacInf} ${r.vacInf>1?"meses estavam":"mês estava"} em branco na planilha antiga (provável vago).`:""}</em>`:""}
    <em>Pagou ${Math.round(r.payP*100)}% dos meses em que esteve alugado.</em></div>`;
  /* por endereço */
  const byP={};res.forEach(r=>{(byP[r.t.predio]=byP[r.t.predio]||[]).push(r)});
  const pRows=Object.entries(byP).map(([p,a])=>{const o=a.reduce((x,r)=>x+r.occ,0),b=a.reduce((x,r)=>x+r.obs,0),v=a.reduce((x,r)=>x+r.vac,0);return {p,score:Math.round(b?o/b*100:0),v,b,n:a.length}}).sort((a,b)=>b.score-a.score);
  const worst=[...res].filter(r=>r.vac>0).sort((a,b)=>b.vac-a.vac||a.score-b.score);
  const best=[...res].sort((a,b)=>b.score-a.score||b.payP-a.payP);
  return `<button class="back" data-act="idxback">‹ Voltar</button>
  <h2 class="pagetitle">Índice Imóveis</h2>
  <div class="idx"><p><b style="color:var(--fg)">O que é:</b> mostra o quanto cada imóvel fica alugado. Temos dados de <b style="color:var(--fg)">${ymLabel(first)} a ${ymLabel(last)}</b>: ${months.length} meses${missing.length?` (a planilha antiga não tinha ${missing.map(ymLabel).join(", ")})`:""}.</p>
  <p><b style="color:var(--fg)">Como ler:</b> "34 meses com dados · alugado 14 · vago 20" quer dizer que, dos 34 meses que conhecemos daquela unidade, ela ficou 14 alugada e 20 vazia. A porcentagem é a parte do tempo alugada: acima de 95% é <span class="grade g-alta">alta</span>, de 85% a 95% <span class="grade g-media">média</span>, abaixo de 85% <span class="grade g-baixa">baixa</span>.</p>
  <p><b style="color:var(--fg)">Períodos:</b> cada vez que o imóvel esvaziou e depois foi alugado de novo conta como um período vago. "2 períodos" = esvaziou duas vezes.</p>
  <p><b style="color:var(--fg)">Atenção:</b> na planilha antiga, quando uma unidade ficava 2 meses ou mais sem nenhuma anotação, contamos como vaga. Se não era, toque no inquilino e corrija o mês.</p></div>
  <section class="group"><div class="ghead"><h2>Por endereço</h2></div><div class="idx">${pRows.map(r=>`<div class="idxrow"><b>${esc(r.p)}</b><span class="grade g-${r.score>=95?"alta":r.score>=85?"media":"baixa"}">${r.score}%</span><div class="meter"><i style="width:${r.score}%;background:${gColor[r.score>=95?"alta":r.score>=85?"media":"baixa"]}"></i></div><em>${r.n} ${r.n===1?"unidade":"unidades"} · somando todas: ${r.b} meses com dados, ${r.v} ${r.v===1?"mês vago":"meses vagos"}</em></div>`).join("")}</div></section>
  <section class="group"><div class="ghead"><h2>Ficaram mais tempo desocupados</h2><span class="tot">${worst.length}</span></div><div class="idx">${worst.length?worst.slice(0,12).map(row).join(""):"<p>Nenhum imóvel ficou vago no período.</p>"}</div></section>
  ${state.idxAll?`<section class="group"><div class="ghead"><h2>Todos os imóveis, do mais líquido ao menos</h2></div><div class="idx">${best.map(row).join("")}</div></section>`:`<button class="btn ghost" data-act="idxall">Ver todos os ${best.length} imóveis</button>`}`;
}

/* operações de dados (usadas pelos botões e pela Selma) */
const ops={
  async put(id,ymS,obj){const full={forma:null,valor:null,devido:null,parcial:null,obs:null,nao:null,hist:null,em:null};
    await state.db.collection("pagamentos").doc(ymS).set({[id]:obj?Object.assign(full,obj):null},{merge:true});},
  /* amount vazio = pagou tudo; amount = valor recebido agora (soma com o que já pagou no mês) */
  async pay(id,ymS,forma="Pix",amount){const t=findT(id);if(!t)throw new Error("Inquilino não encontrado");
    const prev=entry(t,ymS), due=Number((prev&&prev.devido)||t.valor||0);
    const ja=isPaid(prev)&&prev.devido!=null?Number(prev.valor||0):0;
    const got=amount==null?due:ja+Number(amount);
    const em=new Date().toISOString();
    if(got>=due-0.009) await ops.put(id,ymS,{forma,valor:due,em});
    else await ops.put(id,ymS,{forma,valor:Math.round(got*100)/100,devido:due,parcial:true,em});},
  async clear(id,ymS){await ops.put(id,ymS,null);},
  async noCharge(id,ymS,motivo){await ops.put(id,ymS,{obs:motivo||"Sem cobrança"});},
  async edit(id,fields){const ok={};["nome","predio","unidade","dia","valor","ativo","desde"].forEach(k=>{if(fields[k]!==undefined&&fields[k]!==null)ok[k]=fields[k]});
    if(ok.dia!==undefined)ok.dia=Math.max(1,Math.min(31,parseInt(ok.dia,10)||1));
    if(ok.valor!==undefined)ok.valor=Number(ok.valor)||0;
    await state.db.collection("inquilinos").doc(id).update(ok);},
  async vacate(id){await state.db.collection("inquilinos").doc(id).update({ativo:false});
    await ops.put(id,CUR(),{obs:"Desocupado"});},
  async rent(id,f){const body={ativo:true,desde:CUR(),nome:f.nome||"Sem nome"};if(f.dia)body.dia=Math.max(1,Math.min(31,parseInt(f.dia,10)||1));if(f.valor!==undefined&&f.valor!=="")body.valor=Number(f.valor)||0;
    await state.db.collection("inquilinos").doc(id).update(body);
    await ops.put(id,CUR(),null);},
  async add(f){const body={nome:f.nome||"Sem nome",predio:f.predio,unidade:f.unidade||"",dia:Math.max(1,Math.min(31,parseInt(f.dia,10)||10)),valor:Number(f.valor)||0,ativo:f.ativo!==false,desde:CUR()};
    const ref=await state.db.collection("inquilinos").add(body);return ref.id;},
  async renameEnd(oldP,newP){const b=state.db.batch();state.tenants.filter(t=>t.predio===oldP).forEach(t=>b.update(state.db.collection("inquilinos").doc(t.id),{predio:newP}));await b.commit();}
};

function openTenant(id,yearSel){
  const t=findT(id); if(!t) return;
  const year=yearSel||state.y;
  const s=status(t), dl=debtList(t), late=dl.map(d=>d.ym), sd=dl.reduce((a,d)=>a+d.falta,0), mes=MESES[state.m];
  let main="";
  if(t.ativo===false){

function exportBackup(){
  const b={app:"controle-alugueis",versao:1,inquilinos:{},pagamentos:state.pays};
  state.tenants.forEach(t=>{const c=Object.assign({},t);delete c.id;b.inquilinos[t.id]=c});
  const blob=new Blob([JSON.stringify(b,null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="backup-alugueis-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();a.remove();
}
async function importBackup(e){
  const f=e.target.files[0];e.target.value="";if(!f)return;
  let b;try{b=JSON.parse(await f.text())}catch(x){toast("Arquivo inválido");return}
  if(!b||b.app!=="controle-alugueis"){toast("Esse arquivo não é um backup dos aluguéis");return}
  const ni=Object.keys(b.inquilinos||{}).length, np=Object.keys(b.pagamentos||{}).length;
  const sh=openSheet(`<h3>Importar backup</h3><div class="sub">${ni} unidades e ${np} meses de pagamentos.</div>
    <div class="note">Os meses do arquivo são somados aos que já existem. Nada que já está aqui é apagado.</div>
    <button class="btn pay" data-x="go">Importar agora</button><button class="btn ghost" data-x="close">Cancelar</button>`);
  sh.addEventListener("click",async ev=>{const a=ev.target.closest("[data-x]");if(!a)return;
    if(a.dataset.x==="close"){closeSheet();return}
    a.disabled=true;a.textContent="Importando…";
    try{
      const writes=[];
      Object.entries(b.inquilinos||{}).forEach(([id,d])=>writes.push(["inquilinos",id,d,false]));
      Object.entries(b.pagamentos||{}).forEach(([id,d])=>writes.push(["pagamentos",id,d,true]));
      for(let i=0;i<writes.length;i+=400){const bt=state.db.batch();writes.slice(i,i+400).forEach(([c,id,d,m])=>bt.set(state.db.collection(c).doc(id),d,m?{merge:true}:{}));await bt.commit();}
      closeSheet();toast("Backup importado");
    }catch(x){a.disabled=false;a.textContent="Importar agora";errToast()}
  });
}

function quickAnswers(){
  const cur=CUR(), lateT=active().map(t=>({t,l:debtList(t)})).filter(x=>x.l.length).map(x=>Object.assign(x,{sd:x.l.reduce((a,d)=>a+d.falta,0)})).sort((a,b)=>b.sd-a.sd);
  const today=now.getDate();
  return {
    "Quem está atrasado?":()=>lateT.length?"Têm saldo devedor:\n"+lateT.map(x=>`• ${x.t.nome} (${x.t.unidade}, ${x.t.predio}): deve ${brl(x.sd)} – ${x.l.map(d=>ymLabel(d.ym)+(d.parcial?" (parte)":"")).join(", ")}`).join("\n")+`\n\nTotal devido: ${brl(lateT.reduce((a,x)=>a+x.sd,0))}.`:"Ninguém está devendo. Tudo em dia!",
    "Quanto falta receber este mês?":()=>{const a=active();let tot=0,pg=0;a.forEach(t=>{const e=entry(t,cur);if(isNA(e))return;tot+=Number((e&&e.devido)||t.valor||0);pg+=paidAmt(e,t)});return `Em ${MESES[now.getMonth()]} o total é ${brl2(tot)}. Já entrou ${brl2(pg)} e falta ${brl2(tot-pg)}.`},
    "Quem vence esta semana?":()=>{const l=active().filter(t=>{const e=entry(t,cur);if((isPaid(e)&&!(remainder(e)>0.009))||isNA(e))return false;const d=dueDayIn(t,now.getFullYear(),now.getMonth());return d>=today&&d<=today+7}).sort((a,b)=>a.dia-b.dia);return l.length?"Vencem nos próximos 7 dias:\n"+l.map(t=>`• Dia ${pad(t.dia)} – ${t.nome} (${t.unidade}, ${t.predio}) – ${brl(t.valor)}`).join("\n"):"Ninguém vence nos próximos 7 dias."},
    "Quais imóveis estão vagos?":()=>{const v=state.tenants.filter(t=>t.ativo===false);return v.length?"Unidades vagas agora:\n"+v.map(t=>`• ${t.unidade} – ${t.predio} (${brl(t.valor)})`).join("\n"):"Nenhuma unidade vaga. Tudo alugado!"},
    "Como marco um pagamento?":()=>"É fácil:\n1. Toque no nome do inquilino.\n2. Escolha como pagou (Pix, Dinheiro ou Boleto).\n3. Toque no botão verde \"Recebi o aluguel\".\n\nSe ele tinha meses atrasados, aparece uma caixa vermelha com cada mês e um botão \"Recebi\" do lado."
  };
}

}
const TOOLS=[
 {name:"marcar_pagamento",description:"Registra pagamento de um mês. Sem 'valor' = pagou tudo que faltava. Com 'valor' = pagamento parcial desse valor (soma com o que já tinha pago no mês; o resto vira saldo devedor).",input_schema:{type:"object",properties:{inquilino_id:{type:"string"},mes:{type:"string",description:"AAAA-MM"},forma:{type:"string",enum:["Pix","Dinheiro","Boleto","Outro"]},valor:{type:"number",description:"valor recebido agora, só se for parcial"}},required:["inquilino_id","mes"]}},
 {name:"desfazer_pagamento",description:"Volta um mês para 'não pago' (remove pagamento ou observação).",input_schema:{type:"object",properties:{inquilino_id:{type:"string"},mes:{type:"string"}},required:["inquilino_id","mes"]}},
 {name:"marcar_sem_cobranca",description:"Marca um mês como sem cobrança (ex.: vago, acordo, calção).",input_schema:{type:"object",properties:{inquilino_id:{type:"string"},mes:{type:"string"},motivo:{type:"string"}},required:["inquilino_id","mes","motivo"]}},
 {name:"editar_inquilino",description:"Altera dados de uma unidade/inquilino: nome, dia de vencimento, valor, unidade ou endereço.",input_schema:{type:"object",properties:{inquilino_id:{type:"string"},nome:{type:"string"},dia:{type:"integer"},valor:{type:"number"},unidade:{type:"string"},predio:{type:"string"}},required:["inquilino_id"]}},
 {name:"desocupar_unidade",description:"Registra que o inquilino saiu e a unidade ficou vaga.",input_schema:{type:"object",properties:{inquilino_id:{type:"string"}},required:["inquilino_id"]}},
 {name:"alugar_unidade",description:"Aluga uma unidade vaga para um novo inquilino.",input_schema:{type:"object",properties:{inquilino_id:{type:"string"},nome:{type:"string"},dia:{type:"integer"},valor:{type:"number"}},required:["inquilino_id","nome"]}},
 {name:"adicionar_unidade",description:"Cadastra uma unidade nova.",input_schema:{type:"object",properties:{predio:{type:"string"},unidade:{type:"string"},nome:{type:"string"},dia:{type:"integer"},valor:{type:"number"}},required:["predio","unidade","nome","dia","valor"]}},
 {name:"ver_historico",description:"Mostra o histórico de todos os meses de uma unidade.",input_schema:{type:"object",properties:{inquilino_id:{type:"string"}},required:["inquilino_id"]}},
 {name:"indice_imoveis",description:"Retorna o índice de liquidez de locação de cada imóvel.",input_schema:{type:"object",properties:{}}}
];
async function runTool(name,inp){
  const t=inp.inquilino_id?findT(inp.inquilino_id):null;
  if(inp.inquilino_id&&!t) return "Erro: inquilino_id não existe.";
  switch(name){
    case "marcar_pagamento": await ops.pay(t.id,inp.mes,inp.forma||"Pix",inp.valor==null?undefined:Number(inp.valor)); {const e=entry(t,inp.mes);return remainder(e)>0.009?`Ok: ${t.nome} ${inp.mes} pagou parte; falta ${brl2(remainder(e))}.`:`Ok: ${t.nome} ${inp.mes} pago.`}
    case "desfazer_pagamento": await ops.clear(t.id,inp.mes); return `Ok: ${t.nome} ${inp.mes} voltou para não pago.`;
    case "marcar_sem_cobranca": await ops.noCharge(t.id,inp.mes,inp.motivo); return `Ok.`;
    case "editar_inquilino": {const f=Object.assign({},inp);delete f.inquilino_id;await ops.edit(t.id,f);return "Ok: dados alterados.";}
    case "desocupar_unidade": await ops.vacate(t.id); return "Ok: unidade vaga.";
    case "alugar_unidade": await ops.rent(t.id,inp); return "Ok: unidade alugada.";
    case "adicionar_unidade": {const id=await ops.add(inp);return "Ok: criada com id "+id;}
    case "ver_historico": return Object.keys(state.pays).sort().map(s=>{const e=entry(t,s);return s+": "+(isPaid(e)?(remainder(e)>0.009?"parcial, falta "+brl2(remainder(e)):"pago"):isNA(e)?e.obs:(s<startOf(t)?"(antes do controle)":"não pago"))}).join("\n");
    case "indice_imoveis": return computeIndex().res.map(r=>`${r.t.unidade} ${r.t.predio}: ${r.score}% alugado, ${r.vac} meses vago em ${r.ep} vezes, pagou ${Math.round(r.payP*100)}%`).join("\n");
  }
  return "Ferramenta desconhecida.";
}
async function sendSelma(text){
  chat.msgs.push({r:"u",t:text});
  const key=state.cfg&&state.cfg.apiKey;
  if(!key){
    const qa=quickAnswers(), k=Object.keys(qa).find(q=>q.toLowerCase().replace(/[?]/g,"").split(" ").filter(w=>w.length>3).some(w=>text.toLowerCase().includes(w)));
    chat.msgs.push({r:"s",t:k?qa[k]():"Ainda não consigo entender mensagens escritas. Toque numa das perguntas logo acima da caixa de texto, ou peça ao Leo para me ativar em \"Dados e conta\"."});
    renderChat();return;
  }
  chat.api.push({role:"user",content:text});
  chat.busy=true;renderChat();
  const sys=`Você é a Selma, assistente do app de controle de aluguéis de um senhor de mais idade. Fale português do Brasil, com frases curtas, claras e gentis, sem termos técnicos. Hoje é ${now.toLocaleDateString("pt-BR")} (mês atual ${CUR()}). O app mostra o total a receber do mês, quem pagou, quem está a pagar e quem está atrasado. Saldo devedor = meses vencidos não pagos + o que faltou em pagamentos parciais, contando a partir de ${LATE_START}. Para pagamento parcial use marcar_pagamento com 'valor'. Use as ferramentas para mudar dados. Para marcar pagamento quando o pedido for claro, faça direto. Antes de desocupar unidade, apagar ou mudar valor/endereço, confirme com a pessoa. Se houver mais de um inquilino com o mesmo nome, pergunte qual unidade. Depois de mudar algo, diga em uma frase o que foi feito.\n\nDados atuais (id | nome | endereço | unidade | vencimento | valor | situação | mês atual | atrasos):\n${snapshotForAI()}`;
  try{
    for(let round=0;round<6;round++){
      const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-5-5",max_tokens:1024,system:sys,tools:TOOLS,messages:chat.api})});
      const j=await r.json();
      if(!r.ok) throw new Error(j&&j.error&&j.error.message||"erro");
      chat.api.push({role:"assistant",content:j.content});
      const txt=j.content.filter(c=>c.type==="text").map(c=>c.text).join("\n").trim();
      if(txt) chat.msgs.push({r:"s",t:txt});
      const uses=j.content.filter(c=>c.type==="tool_use");
      if(!uses.length||j.stop_reason!=="tool_use") break;
      const results=[];
      for(const u of uses){let out;try{out=await runTool(u.name,u.input||{})}catch(x){out="Erro: "+x.message}
        results.push({type:"tool_result",tool_use_id:u.id,content:String(out)});
        if(/^Ok/.test(out)) chat.msgs.push({r:"sys",t:"✓ "+out.replace(/^Ok:?\s*/,"")});}
      chat.api.push({role:"user",content:results});
      renderChat();
    }
  }catch(x){chat.msgs.push({r:"s",t:"Não consegui responder agora. Confira a internet ou a chave da Selma e tente de novo."});chat.api=[];}
  if(chat.api.length>30) chat.api=[];
  chat.busy=false;renderChat();
}

const L=$("list");

  const a=e.target.closest("[data-act]");
  if(a){const k=a.dataset.act;
    if(k==="endback"){state.endSel=null;render();return}
    if(k==="idxall"){state.idxAll=true;render();return}

    if(k==="csv"){exportCSV();return}

  const en=e.target.closest("[data-end]"); if(en){state.endSel=en.dataset.end;state.endTab="todas";render();window.scrollTo({top:document.querySelector(".menu").offsetTop-10,behavior:"smooth"});return}
  const et=e.target.closest("[data-endtab]"); if(et){state.endTab=et.dataset.endtab;render();return}

});

document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeSheet();if(chat.open){chat.open=false;renderChat()}}});

setInterval(()=>{const n=new Date();if(n.getDate()!==now.getDate()){const wasCur=state.y===now.getFullYear()&&state.m===now.getMonth();now=n;if(wasCur){state.y=n.getFullYear();state.m=n.getMonth()}render()}},60000);

/* ---------- Firebase ---------- */
firebase.initializeApp(firebaseConfig);
const fdb=firebase.firestore();
try{fdb.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
const auth=firebase.auth();
let unsubs=[];
auth.onAuthStateChanged(user=>{
  unsubs.forEach(u=>u());unsubs=[];
  if(!user){$("login").hidden=false;state.db=null;state.ready=false;state.tenants=[];state.pays={};chat.open=false;renderChat();render();return}
  $("login").hidden=true;state.db=fdb;
  let gotT=false,gotP=false;
  const ready=()=>{if(gotT&&gotP){state.ready=true}render();renderChat()};
  unsubs.push(fdb.collection("inquilinos").onSnapshot(s=>{state.tenants=s.docs.map(d=>Object.assign({id:d.id},d.data()));gotT=true;ready()},
    ()=>{gotT=true;ready();toast("Sem permissão para ler os dados. Confira as regras do Firestore.")}));
  unsubs.push(fdb.collection("pagamentos").onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());state.pays=m;gotP=true;ready()},()=>{gotP=true;ready()}));
  unsubs.push(fdb.collection("config").doc("selma").onSnapshot(d=>{state.cfg=d.exists?d.data():{};if(chat.open)renderChat()},()=>{}));
});
$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();const err=$("lErr"),btn=$("lBtn");
  err.hidden=true;btn.disabled=true;btn.textContent="Entrando…";
  try{await auth.signInWithEmailAndPassword($("lEmail").value.trim(),$("lPass").value)}
  catch(x){err.textContent="E-mail ou senha incorretos.";err.hidden=false}
  btn.disabled=false;btn.textContent="Entrar";
});
})();
